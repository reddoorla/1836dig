# pnpm 11 reads settings from here (the package.json "pnpm" field is no longer read).
allowBuilds:
  esbuild: true
minimumReleaseAge: 0

# Transitive-dependency security pins (same idiom as reddoor-starter —
# pnpm 11 reads overrides HERE, not package.json).
overrides:
  qs@<6.15.2: ">=6.15.2 <7"
  uuid@<11.1.1: ">=11.1.1"
  cookie@<0.7.0: ">=0.7.0 <1"
